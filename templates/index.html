<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casino Dice</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      font-family:-apple-system,Segoe UI,Roboto,sans-serif;
      background:radial-gradient(circle at 50% 30%,#1b7a4b,#0b3d25); color:#fff; }
    .table { text-align:center; background:#0e5133; border:6px solid #d4af37; border-radius:20px;
      padding:40px 50px; box-shadow:0 10px 40px rgba(0,0,0,.5); width:360px; }
    h1 { margin:0 0 6px; font-size:28px; }
    .sub { color:#d4af37; margin:0 0 24px; font-size:13px; text-transform:uppercase; letter-spacing:2px; }
    .dice { font-size:90px; line-height:1; margin:10px 0; }
    .outcome { font-size:22px; font-weight:700; min-height:30px; margin:16px 0; }
    .total { color:#d4af37; font-size:15px; margin-bottom:20px; min-height:18px; }
    button { background:#d4af37; color:#0b3d25; border:0; padding:14px 34px; font-size:17px;
      font-weight:700; border-radius:30px; cursor:pointer; letter-spacing:1px; }
    button:active { transform:scale(.96); }
  </style>
</head>
<body>
  <div class="table">
    <h1>🎲 Casino Dice</h1>
    <p class="sub">Roll to play</p>
    <div class="dice" id="dice">⚀ ⚀</div>
    <div class="outcome" id="outcome">Place your bet</div>
    <div class="total" id="total"></div>
    <button onclick="rollDice()">Roll the dice</button>
  </div>
  <script>
    const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
    async function rollDice() {
      const res = await fetch('/roll');
      const data = await res.json();
      document.getElementById('dice').textContent = faces[data.die1-1] + ' ' + faces[data.die2-1];
      document.getElementById('outcome').textContent = data.outcome;
      document.getElementById('total').textContent = 'Total: ' + data.total;
    }
  </script>
</body>
</html>
